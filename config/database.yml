default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= Rails.application.credentials.postgresql_house[:hostname] %>
  username: <%= Rails.application.credentials.postgresql_house[:username] %>
  password: <%= Rails.application.credentials.postgresql_house[:password] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: <%= Rails.application.credentials.postgresql_house[:dbname] %>

test:
  <<: *default
  database: movements_api_test

production:
  primary: &primary_production
    <<: *default
    database: <%= Rails.application.credentials.postgresql_house[:dbname] %>
    username: <%= Rails.application.credentials.postgresql_house[:username] %>
    password: <%= Rails.application.credentials.postgresql_house[:password] %>
    port: <%= Rails.application.credentials.postgresql_house[:port] %>
  cache:
    <<: *primary_production
    database: movements_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: movements_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: movements_api_production_cable
    migrations_paths: db/cable_migrate
